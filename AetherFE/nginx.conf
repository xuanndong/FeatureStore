server {
    listen 5173;
    server_name localhost;

    # Gzip Compression - Tối ưu hiệu suất truyền tải tài nguyên tĩnh
    gzip on;
    gzip_static on;         # Phục vụ file .gz nếu có sẵn từ quá trình build
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types 
        text/plain 
        text/css 
        text/javascript 
        application/javascript 
        application/x-javascript 
        application/json 
        application/xml 
        application/xml+rss 
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Security Headers - Bảo mật tầng giao diện hệ thống Feature Store
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        # Định tuyến Single Page Application - Hỗ trợ React Router (Vite)
        try_files $uri $uri/ /index.html;
    }

    # Cache tài nguyên tĩnh (Hình ảnh, CSS, JS) để tăng tốc độ phản hồi UI
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Chặn tuyệt đối truy cập vào các tệp ẩn hoặc cấu hình nhạy cảm (như .env)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Đường dẫn log nội bộ bên trong Container để quản trị
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;
}

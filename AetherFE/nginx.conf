server {
    listen 3000;
    server_name localhost;

    # Gzip Compression - Tối ưu hiệu suất 
    gzip on;
    gzip_static on; # Phục vụ file .gz nếu có sẵn
    gzip_varying on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types 
        text/plain 
        text/css 
        text/javascript 
        application/javascript 
        application/x-javascript 
        application/json 
        application/xml 
        application/xml+rss 
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Security Headers - Theo thiết kế bảo mật hệ thống 
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    location / {
        # Hỗ trợ React Router (Vite) 
        try_files $uri $uri/ /index.html;
    }

    # Cache tài nguyên tĩnh để tăng tốc phản hồi UI 
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Chặn truy cập vào các tệp ẩn và nhạy cảm (như .env) [cite: 599]
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Cấu hình log để quản trị cụm Docker 
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;
}
